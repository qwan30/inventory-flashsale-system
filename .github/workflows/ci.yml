name: CI

on:
  push:
    branches:
      - main
      - codex/*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Java artifact
        run: mvn -B -pl apps/api -am -DskipTests package

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install admin-ui deps
        working-directory: apps/admin-ui
        run: npm install

      - name: Install Playwright browsers
        working-directory: apps/admin-ui
        run: npx playwright install chromium

      - name: Run admin-ui unit tests
        working-directory: apps/admin-ui
        run: npm test

      - name: Run admin-ui build
        working-directory: apps/admin-ui
        run: npm run build

      - name: Run admin-ui e2e
        working-directory: apps/admin-ui
        run: npm run test:e2e
