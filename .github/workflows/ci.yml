name: CI

on:
  push:
    branches:
      - master
      - codex/*
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: "maven"

      - name: Run backend unit and integration tests
        run: mvn -B clean verify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/admin-ui/package-lock.json

      - name: Install admin-ui deps
        working-directory: apps/admin-ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/admin-ui
        run: npx playwright install chromium

      - name: Run admin-ui unit tests
        working-directory: apps/admin-ui
        run: npm test

      - name: Run admin-ui build
        working-directory: apps/admin-ui
        run: npm run build

      - name: Run admin-ui e2e
        working-directory: apps/admin-ui
        run: npm run test:e2e

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push Frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin-ui
          file: apps/admin-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

