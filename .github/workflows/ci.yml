name: CI

on:
  push:
    branches:
      - master
      - codex/*
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".gitnexusignore"
      - "LICENSE"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".gitnexusignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Detect what changed ───────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'modules/**'
              - 'apps/api/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
            frontend:
              - 'apps/admin-ui/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'

  # ── Backend CI: Compile, Test & Package ───────────────────────────
  backend-ci:
    name: Backend test and package
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: "maven"

      - name: Run backend unit and integration tests
        run: mvn -B clean verify

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  # ── Frontend CI: Test & Package ───────────────────────────────────
  frontend-ci:
    name: Frontend test and package
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/admin-ui/package-lock.json

      - name: Install admin-ui deps
        working-directory: apps/admin-ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/admin-ui
        run: npx playwright install chromium

      - name: Run admin-ui lint and typecheck
        working-directory: apps/admin-ui
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run admin-ui unit tests
        working-directory: apps/admin-ui
        run: npm test

      - name: Run admin-ui build
        working-directory: apps/admin-ui
        run: npm run build

      - name: Run admin-ui e2e
        working-directory: apps/admin-ui
        run: npm run test:e2e

      - name: Upload Playwright Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin-ui/playwright-report/
          retention-days: 7

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin-ui
          file: apps/admin-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
