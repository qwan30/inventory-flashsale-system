name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to rollback"
        required: true
        type: choice
        options:
          - production
      image-tag:
        description: "Docker image tag to rollback to (e.g., sha-abc1234 or latest)"
        required: true
        type: string
      confirm:
        description: "Type 'ROLLBACK' to confirm this action"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate rollback confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check confirmation string
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "ROLLBACK" ]; then
            echo "::error::Confirmation required. Type 'ROLLBACK' in the confirm field."
            exit 1
          fi
          echo "✓ Rollback confirmed for environment: ${{ github.event.inputs.environment }}"

  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: SSH — rollback to specified image tag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/inventory-flashsale

            REPO="${{ github.repository }}"
            TAG="${{ github.event.inputs.image-tag }}"

            echo "⚠ Rolling back ${{ github.event.inputs.environment }} to tag: ${TAG}"

            # Log in to GHCR on the target machine
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull specific image versions
            docker pull "ghcr.io/${REPO}/backend:${TAG}"
            docker pull "ghcr.io/${REPO}/frontend:${TAG}"

            # Override image tags and redeploy
            BACKEND_IMAGE="ghcr.io/${REPO}/backend:${TAG}" \
            FRONTEND_IMAGE="ghcr.io/${REPO}/frontend:${TAG}" \
            docker compose up -d --remove-orphans

            echo "✓ Rollback completed — backend/frontend:${TAG}"

            # Post-rollback health check on Port 8080 (Backend)
            for attempt in $(seq 1 12); do
              echo "Health check attempt ${attempt}/12"
              if curl -sSf http://localhost:8080/ > /dev/null 2>&1; then
                echo "✓ Backend healthy after rollback"
                exit 0
              fi
              echo "Backend not ready, waiting 10s..."
              sleep 10
            done
            echo "✗ Health check failed after rollback — manual intervention required"
            exit 1
