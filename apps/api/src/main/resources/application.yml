spring:
  application:
    name: inventory-flashsale-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flashsale}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:flashsale}
    password: ${DB_PASSWORD:flashsale}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  reservation:
    ttl: 10m
  lock:
    wait-timeout: 2s
    lease-timeout: 5s
  outbox:
    publish-batch-size: 50
    retry-delay: 10s
    max-attempts: 5
  channel:
    sync-batch-size: 50
    retry-delay: 15s
    max-attempts: 3
    tik-tok:
      mode: mock
      base-url: ${APP_CHANNEL_TIKTOK_BASE_URL:https://open-api.tiktokglobalshop.com}
      app-key: ${APP_CHANNEL_TIKTOK_APP_KEY:}
      app-secret: ${APP_CHANNEL_TIKTOK_APP_SECRET:}
      shop-cipher: ${APP_CHANNEL_TIKTOK_SHOP_CIPHER:}
      access-token: ${APP_CHANNEL_TIKTOK_ACCESS_TOKEN:}
      ingress-secret: ${APP_CHANNEL_TIKTOK_INGRESS_SECRET:}
      connect-timeout: 2s
      read-timeout: 5s
  alerts:
    outbox-failed-threshold: 10
    channel-sync-failed-threshold: 10
    reconciliation-open-drift-threshold: 5
    channel-snapshot-staleness: 5m
    delivery:
      enabled: false
      webhook-url: ${APP_ALERTS_DELIVERY_WEBHOOK_URL:}
      connect-timeout: 2s
      read-timeout: 5s
      reminder-interval: 15m
      slack:
        enabled: false
        webhook-url: ${APP_ALERTS_DELIVERY_SLACK_WEBHOOK_URL:}
        minimum-severity: WARN
        connect-timeout: 2s
        read-timeout: 5s
      pager-duty:
        enabled: false
        events-url: ${APP_ALERTS_DELIVERY_PAGER_DUTY_EVENTS_URL:https://events.pagerduty.com/v2/enqueue}
        routing-key: ${APP_ALERTS_DELIVERY_PAGER_DUTY_ROUTING_KEY:}
        minimum-severity: CRITICAL
        connect-timeout: 2s
        read-timeout: 5s
  scheduler:
    expired-reservation-delay: 30s
    outbox-delay: 5s
    channel-sync-delay: 10s
    reconciliation-delay: 60s
    alert-delivery-delay: 30s
  kafka:
    topic: inventory-flashsale.events
  benchmark:
    evidence-root: testing/k6/evidence
  ai:
    enabled: ${APP_AI_ENABLED:false}
    provider: ${APP_AI_PROVIDER:gemini}
    connect-timeout: ${APP_AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${APP_AI_READ_TIMEOUT:20s}
    retry-count: ${APP_AI_RETRY_COUNT:1}
    max-response-chars: ${APP_AI_MAX_RESPONSE_CHARS:4000}
    max-output-tokens: ${APP_AI_MAX_OUTPUT_TOKENS:768}
    gemini:
      base-url: ${APP_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${APP_AI_GEMINI_API_KEY:}
      model: ${APP_AI_GEMINI_MODEL:gemini-2.5-flash}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:inventory-flashsale-api}
      secret: ${APP_SECURITY_JWT_SECRET:change-me-change-me-change-me-1234}
      access-token-ttl: ${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${APP_SECURITY_JWT_REFRESH_TOKEN_TTL:168h}
      refresh-cookie:
        enabled: false
        name: admin_refresh_token
        path: /api/v1/admin/auth
        secure: false
        same-site: Strict
    seed-users:
      admin-username: ${APP_SECURITY_SEED_ADMIN_USERNAME:admin}
      admin-password: ${APP_SECURITY_SEED_ADMIN_PASSWORD:Admin123!}
      admin-display-name: ${APP_SECURITY_SEED_ADMIN_DISPLAY_NAME:System Admin}
      operator-username: ${APP_SECURITY_SEED_OPERATOR_USERNAME:operator}
      operator-password: ${APP_SECURITY_SEED_OPERATOR_PASSWORD:Operator123!}
      operator-display-name: ${APP_SECURITY_SEED_OPERATOR_DISPLAY_NAME:Operations User}

logging:
  level:
    root: INFO
    com.codex.flashsale: INFO
