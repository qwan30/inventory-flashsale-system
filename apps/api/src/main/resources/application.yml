spring:
  application:
    name: inventory-flashsale-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flashsale}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:flashsale}
    password: ${DB_PASSWORD:flashsale}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  reservation:
    ttl: 10m
  lock:
    wait-timeout: 2s
    lease-timeout: 5s
  outbox:
    publish-batch-size: 50
    retry-delay: 10s
    max-attempts: 5
  channel:
    sync-batch-size: 50
    retry-delay: 15s
    max-attempts: 3
  alerts:
    outbox-failed-threshold: 10
    channel-sync-failed-threshold: 10
    reconciliation-open-drift-threshold: 5
    channel-snapshot-staleness: 5m
    delivery:
      enabled: false
      connect-timeout: 2s
      read-timeout: 5s
      reminder-interval: 15m
  scheduler:
    expired-reservation-delay: 30s
    outbox-delay: 5s
    channel-sync-delay: 10s
    reconciliation-delay: 60s
    alert-delivery-delay: 30s
  kafka:
    topic: inventory-flashsale.events

logging:
  level:
    root: INFO
    com.codex.flashsale: INFO
